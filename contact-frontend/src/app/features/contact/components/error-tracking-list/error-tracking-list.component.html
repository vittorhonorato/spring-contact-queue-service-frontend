<ng-container *ngIf="errors.length; else emptyState">
  <table mat-table [dataSource]="errors" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let e">{{ e.id }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let e">{{ e.email }}</td>
    </ng-container>

    <ng-container matColumnDef="subject">
      <th mat-header-cell *matHeaderCellDef>Assunto</th>
      <td mat-cell *matCellDef="let e">{{ e.subject }}</td>
    </ng-container>

    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef>Motivo do erro</th>
      <td mat-cell *matCellDef="let e">
        <span class="reason" [matTooltip]="e.reason">{{ e.reason }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Criado em</th>
      <td mat-cell *matCellDef="let e">{{ e.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</ng-container>

<ng-template #emptyState>
  <div class="empty-state">
    <h3>Nenhum erro encontrado</h3>
    <p>Quando um contato tiver status ERROR, o motivo aparecera aqui.</p>
  </div>
</ng-template>
