<form class="search-form" [formGroup]="form" (ngSubmit)="submit()">
  <app-input
    class="search-input"
    formControlName="id"
    label="Buscar por ID"
    placeholder="Digite o ID do contato">
  </app-input>

  <div class="actions">
    <app-button
      type="submit"
      label="Buscar"
      [disabled]="form.invalid || loading">
    </app-button>

    <app-button
      type="button"
      label="Limpar"
      [disabled]="loading || !hasIdValue"
      (click)="clear()">
    </app-button>
  </div>
</form>
